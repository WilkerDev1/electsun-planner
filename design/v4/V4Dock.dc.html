<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["proyectos","equipo","mural"],"default":"proyectos"},"$preview":{"width":96,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'proyectos';
    const items = [
      { key: 'proyectos', label: 'Proyectos', href: 'V4Proyectos.dc.html', icon: 'M3 5h18v14H3zM3 10h18M3 15h18M9 5v14' },

      const on = it.key === active;
      return { ...it, current: on ? 'page' : 'false', bg: on ? '#1B1F27' : 'transparent', fg: on ? '#FFFFFF' : '#475467' };
    });
    return { items };
  }
}
</script>
